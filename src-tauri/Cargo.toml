[package]
name = "jawata-studio"
version = "4.1.4"
description = "Desktop manager for running JAWATA MCP across multiple Java projects."
license = "AGPL-3.0-only"
edition = "2021"
# The crate lives in a workspace whose default-members carry TWO binaries
# (jawata-studio, jawata-hook), so a bare `cargo run` — which is exactly what
# `tauri dev` issues — could not choose and failed with "could not determine
# which binary to run". Naming the app here fixes `npm run tauri dev` without
# narrowing default-members, which is what makes `cargo test` cover both.
default-run = "jawata-studio"

[lib]
name = "jawata_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
dirs = "6.0.0"
flate2 = "1.1.5"
# Sprint 15 Stage 9: per-workspace bearer tokens (32-byte SecureRandom hex).
getrandom = "0.2"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tar = "0.4.44"
# Sprint 16b/B: blocking inbound HTTP server for the single-service gateway.
tiny_http = "0.12"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-single-instance = "2"
walkdir = "2.5.0"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
toml_edit = "0.25.13"

# Sprint 28 (D-SHIM) — the workspace exists so `jawata-hook` can be a SIBLING
# crate rather than a module of this one. That is the enforcement, not a
# convention: a hook binary that could `use` studio's internals would sooner or
# later reach for tauri, and a hook process must never link a GUI toolkit. The
# edge is absent from jawata-hook/Cargo.toml, so `hook -> tauri` and
# `hook -> jawata_studio_lib` are COMPILE ERRORS, asserted by the build.
[workspace]
members = ["jawata-hook"]
# default-members is NOT optional here. Without it, `cargo build` and
# `cargo test` — the commands CONTRIBUTING.md and the PR template tell people
# to run — build ONLY jawata-studio: the hook crate is never compiled, its 76
# tests never run, and a PR that breaks the payload parser is green with the
# test that would have caught it sitting uncompiled. Found by the C5 audit,
# which also refuted the design doc's claim that "a workspace member is driven
# by cargo test exactly as a module is".
default-members = [".", "jawata-hook"]

# panic = "unwind" is load-bearing, not a default worth inheriting silently: the
# fail-safe boundary catches a panicking role and still exits 0. Under
# panic = "abort" the process dies with a non-zero status and the client sees a
# hook failure — which, on Cursor's failClosed guard, blocks the user's shell
# command. A test asserts this setting.
[profile.release]
panic = "unwind"
