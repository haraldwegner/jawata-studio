name: Release
on:
  push:
    tags:
      - 'v*'
  # Sprint 16: build-only validation runs (no release created) — used to
  # iterate on the Windows matrix without burning real release tags.
  workflow_dispatch:

jobs:
  # THE PATCH-STREAK GATE IS NOT HERE ANY MORE, AND ITS ABSENCE IS A DECISION
  # (Harald, 2026-09-02): "A quality gate like too many patches is a dev quality
  # gate which stays on this machine and should not be part of the CI."
  #
  # The gate stays in build/patch-streak-gate.sh and runs ON THE DEV MACHINE
  # before a tag is pushed — the one place its question can be answered: the
  # agent doing the tagging is stopped, the streak is put in front of Harald in
  # conversation, and his word clears it. The CI copy fired AFTER that decision
  # and could be cleared only through a repository-settings page — a channel
  # that cannot carry the answer to the question the gate asks. Proven the same
  # evening in jawata-mcp, on his own release, mid-flight.

  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Sprint 16: windows-2022 = x64 (MSVC), windows-11-arm = ARM64.
        # Both produce .msi (WiX) + setup .exe (NSIS) via targets: "all".
        platform: [ubuntu-22.04, ubuntu-22.04-arm, macos-14, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Sprint 28 Stage 7 (D-SHIM c): the hook binary as a Tauri SIDECAR.
      # tauri.conf.json declares externalBin: ["binaries/jawata-hook"], and
      # Tauri copies binaries/jawata-hook-<target-triple> into the bundle. The
      # build MUST run before tauri-action, which fails loudly if the
      # triple-suffixed file is absent — the good failure. Building it here
      # rather than reusing target/ means a stale binary cannot ship silently.
      # No triple argument: every runner in this matrix builds NATIVELY (there
      # is no --target anywhere in this job), so the host triple IS the target
      # triple. Passing a hand-maintained platform->triple map would add a
      # five-row table that must stay in sync with the matrix for no gain.
      - name: Build the hook sidecar
        shell: bash
        run: ./build/build-hook-sidecar.sh

      # The hook crate's tests GATE NOTHING without this. The C8 audit found
      # that CI only ever ran `cargo build` for it, so 148 tests — including
      # every fail-safe, every silence reason, and the concurrency proofs —
      # could all go red and a release would ship regardless. They also run on
      # all five targets here, which is the only place the Windows and macOS
      # behaviour of the hook is exercised at all.
      - name: Test the hook crate
        shell: bash
        working-directory: src-tauri
        run: cargo test -p jawata-hook --release

      # Sprint 28 outcome audit, F1: the STUDIO crate's suite — the carrier of
      # the deploy proofs (writer/binary convergence, user-hook preservation,
      # the hook-events.json contract assertions) — ran in NO workflow: the
      # step above gates only the hook crate, so every deploy proof could go
      # red and a release would ship regardless. The sprint's own defect class
      # (a proof that exists and gates nothing), one level up. Linux only:
      # these tests exercise deploy logic, not platform bundles.
      - name: Test the studio crate
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        working-directory: src-tauri
        run: cargo test --release

      # Sprint 28a (D1, R13a): the deploy-path resolution, on EVERY target.
      #
      # The step above is Linux-only and correctly so — deploy MERGE logic does
      # not vary by platform. Path RESOLUTION does, and it is the half no test
      # covered anywhere: the four no-clobber tests each client ships take the
      # settings-file path as a parameter, so they prove a perfect merge into
      # whatever directory they are handed and can never notice that the real
      # deploy resolves somewhere no client reads.
      #
      # `dirs::config_dir()` is the specific hazard — ~/.config on Linux,
      # ~/Library/Application Support on macOS, %APPDATA% on Windows. A client
      # keyed off the home dir instead passes on Linux and is wrong on the
      # other two, silently, forever. This is the first check of those paths
      # anywhere but Linux.
      #
      # Name-filtered rather than a whole-suite ungating: the studio suite's
      # ~300 tests have never run on Windows or macOS and clearing them is not
      # this sprint's job.
      #
      # The count check is not belt-and-braces. `cargo test <filter>` exits 0
      # when the filter matches NOTHING, so a rename of the module would leave
      # this step green while testing zero paths — the same "reports success,
      # does nothing" shape the step exists to catch, one level up. Asserting
      # the number means the step fails loudly if it ever stops selecting.
      #
      # NOT on Windows, and the reason is a real gap rather than a preference:
      # the studio crate's TEST target does not compile there. Its fixtures use
      # `std::os::unix::fs::PermissionsExt`, `set_mode` and `#!/bin/sh` scripts
      # in a dozen places, because "Test the studio crate" above is Linux-only
      # and nothing had ever built that target on Windows. This step was the
      # first thing to ask, and it failed to compile before it could check a
      # single path (v3.9.0's first release run). Tracked as jawata-studio#10.
      #
      # macOS still runs it, and that is not a consolation prize: macOS is where
      # `dirs::config_dir()` returns ~/Library/Application Support rather than
      # ~/.config, which is half of the exact hazard this step exists to catch.
      - name: Deploy paths resolve correctly on this platform
        if: "!startsWith(matrix.platform, 'windows-')"
        shell: bash
        working-directory: src-tauri
        run: |
          set -euo pipefail
          cargo test --release -p jawata-studio --lib deploy_resolves_here \
            -- --nocapture 2>&1 | tee /tmp/resolve.txt
          # 4 since v3.9.1: claude_desktop left the roster and took its
          # path test with it. This number is MEASURED (cargo test --lib
          # deploy_resolves_here), and this very check is what caught the
          # removal — the count must move with the roster, in the same commit.
          EXPECTED=4
          if ! grep -q "^test result: ok\. ${EXPECTED} passed" /tmp/resolve.txt; then
            echo "::error::expected ${EXPECTED} deploy_resolves_here tests to pass on ${{ matrix.platform }}."
            echo "A filter that matches nothing exits 0, so this step must count."
            grep "^test result" /tmp/resolve.txt || echo "no test result line at all"
            exit 1
          fi

      # Sprint 28 "E2E means E2E", closed for real (outcome audit F10): the
      # in-crate seam test drives the hook against a MOCK store serving a
      # committed capture, so a producer-side move cannot fail it. This gate
      # crosses the seam with nothing canned: the freshly built hook binary,
      # the PUBLISHED jawata.jar over real HTTP, a real prompt — and the answer
      # must arrive as injectable context. Red-proven with a mute consumer;
      # a moved store envelope lands in the same failure. Linux only: one
      # honest crossing gates the release; per-OS behaviour is 28a's matrix.
      - name: Cross-product seam gate (hook binary vs published store)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          # Resolve the CURRENT latest asset by shape, never by a baked-in
          # version — a hardcoded name goes stale on the next store release.
          ASSET_URL="$(curl -s https://api.github.com/repos/haraldwegner/jawata-mcp/releases/latest \
            | grep -o 'https://[^"]*linux-x64\.tar\.gz' | head -1)"
          [ -n "$ASSET_URL" ] || { echo "no linux-x64 asset on the latest jawata-mcp release"; exit 1; }
          curl -sLo /tmp/jawata-dist.tar.gz "$ASSET_URL"
          tar -xzf /tmp/jawata-dist.tar.gz -C /tmp
          JAR="$(ls /tmp/jawata-v*/jawata.jar | head -1)"
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          ./build/seam-gate.sh src-tauri/target/release/jawata-hook "$JAR"

      - name: Install frontend dependencies
        run: npm install

      # Sprint 14 (v0.14.0, bugs.md #1 full fix): tauri-action builds
      # the bundles but does NOT upload them yet (tagName omitted on
      # purpose). The Linux-only step below post-processes the AppImage
      # and .deb to bake WEBKIT_DISABLE_DMABUF_RENDERER=1 in, then the
      # final softprops step uploads the patched artifacts to the draft
      # release. macOS artifacts (Stage 6) pass through unmodified.
      - name: Build Tauri app (build only — upload happens below)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sprint 28: Developer ID signing + notarization (studio#2). Without
          # these the .dmg is unsigned and macOS refuses to open it normally —
          # the installer has to be right-clicked and confirmed past a warning.
          #
          # Each is empty on non-macOS runners on purpose: the Linux and Windows
          # jobs share this step, and an APPLE_CERTIFICATE present there would
          # send tauri-action down its keychain-import path on a machine with no
          # keychain.
          #
          # The first two import the certificate into a temporary keychain; the
          # third selects which identity to sign with. The last three are the
          # notarization credentials — Apple checks the signed app and issues a
          # ticket, which is what actually removes the warning. APPLE_PASSWORD is
          # an app-specific password, not the account password; Apple rejects the
          # latter.
          APPLE_CERTIFICATE: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_TEAM_ID || '' }}

      # Sprint 28 (v3.6.4, D-RECALL-DEAD round): tauri-action notarizes the .app,
      # then builds the .dmg FROM it, signs the .dmg, and stops — it never
      # notarizes or staples the installer. `spctl -a -t install` inspects the
      # INSTALLER, so v3.6.3 shipped with the app notarized (Accepted, id
      # 6d38d9da) and the DMG reporting `rejected / source=Unnotarized Developer
      # ID` on a real machine. This step closes that gap with the same three
      # secrets tauri-action already uses — no new credential.
      #
      # `stapler staple` IS the gate: it fails if Apple has no valid ticket for
      # the file, so a failed or Invalid notarization cannot pass silently. The
      # spctl line is informational — a CI runner's assessment is not the user's
      # machine, so it is echoed, never trusted as the proof.
      - name: Notarize + staple the DMG (macos only)
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          echo "Notarizing installer: $DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "--- spctl (informational; the runner is not the user's machine) ---"
          spctl -a -vvv -t install "$DMG" || true

      # Sprint 28a (D6): the portable archive — the Scoop route's payload.
      # Same adjacency law the .deb post-bake enforces: the studio resolves
      # its hook sidecar relative to current_exe() (hook_source_candidates
      # expects `jawata-hook.exe` beside the app), so the zip carries the exe
      # and the sidecar side by side and the step FAILS when either is absent
      # — a zip without the sidecar deploys no hooks while reporting success.
      # Note the trade-off the installers don't have: the portable exe does
      # not bootstrap WebView2 (Windows 11 ships it; the MSI/NSIS routes
      # install it on Windows 10). The Scoop bucket README states this.
      - name: Portable zip (windows only)
        if: startsWith(matrix.platform, 'windows-')
        shell: bash
        run: |
          set -euo pipefail
          REL=src-tauri/target/release
          TRIPLE=$(rustc -vV | awk '/^host:/ {print $2}')
          test -f "$REL/jawata-studio.exe" || { echo "::error::jawata-studio.exe not built"; exit 1; }
          SIDECAR="src-tauri/binaries/jawata-hook-${TRIPLE}.exe"
          test -f "$SIDECAR" || { echo "::error::hook sidecar ${SIDECAR} not built"; exit 1; }
          case "$TRIPLE" in
            aarch64-*) ARCH=arm64 ;;
            *)         ARCH=x64 ;;
          esac
          OUT="jawata-studio-portable-windows-${ARCH}.zip"
          STAGE=portable/jawata-studio
          mkdir -p "$STAGE"
          cp "$REL/jawata-studio.exe" "$STAGE/"
          cp "$SIDECAR" "$STAGE/jawata-hook.exe"
          (cd portable && 7z a "../$OUT" jawata-studio >/dev/null)
          # Assert the archive CONTENT, not the copy commands: list and match,
          # the same capture-then-grep shape as the sidecar containment check.
          LISTING=$(7z l "$OUT")
          echo "$LISTING" | grep -q "jawata-studio.exe" || { echo "::error::zip lacks the app exe"; exit 1; }
          echo "$LISTING" | grep -Eq "jawata[-_]hook" || { echo "::error::zip lacks the hook sidecar"; exit 1; }
          echo "portable archive built: $OUT"

      # Sprint 28 (D-UNWIRED), the Rust half of the same gate jawata-mcp runs
      # on its release. Linux only — the answer is a property of the source,
      # identical on every target.
      #
      # AFTER the Tauri build, not before it: jawata-studio's build script needs
      # the built frontend, so running this earlier failed the compile — and the
      # gate then reported "arm-did-not-run" rather than the compile error,
      # because CI colourises cargo's output and the error match did not allow
      # for ANSI escapes. Both found by firing a real CI run (C7).
      - name: Hollow-wiring gate (test-only items)
        if: matrix.platform == 'ubuntu-22.04'
        run: ./build/unwired-gate.sh

      # C7 exit: "a built bundle on each of the five targets CONTAINS the hook
      # binary". Checked on the artefact, per platform, because externalBin
      # failing to copy is silent from the app's point of view — the studio
      # would deploy nothing and the hooks would simply never exist.
      - name: The bundle must contain the hook sidecar
        shell: bash
        run: |
          set -euo pipefail
          TRIPLE=$(rustc -vV | awk '/^host:/ {print $2}')
          BUNDLE=src-tauri/target/release/bundle

          # PER-PLATFORM, because the payload is a different KIND of thing on
          # each. The first version ran one `find` over $BUNDLE and passed on
          # Linux and macOS while FAILING both Windows jobs — the Windows
          # bundle holds only .msi and NSIS .exe archives, and `find` cannot
          # see inside an archive. That check would have blocked a real release
          # instead of catching a defect. Found by firing a build-only run.
          case "$TRIPLE" in
            *windows*)
              # The installers are archives. 7z ships on GitHub's Windows
              # runners; list them and look for the sidecar by name.
              # PER INSTALLER, not "at least one". The first version appended
              # matches to a list and passed when the list was merely
              # NON-EMPTY. Both Windows jobs ship TWO installers (.msi and the
              # NSIS -setup.exe, both uploaded at the bottom of this file) and
              # it matched ONE — so the .msi shipped to every user with no
              # containment assertion whatsoever, and the check printed only
              # what it found, never what it failed to see. It was true by
              # luck: the C7 audit downloaded both and confirmed the hook IS
              # in the MSI File table. Guarded by nothing is not guarded.
              #
              # Match jawata[-_]hook: WiX keys a File by an identifier that
              # cannot contain a hyphen, so the same payload is listed as
              # `Bin_jawata_hook.exe` in an .msi and `jawata-hook.exe` in the
              # NSIS archive. A hyphen-only pattern is why one of the two
              # silently missed.
              N=0; SAW_MSI=0; SAW_NSIS=0
              for INSTALLER in $(find "$BUNDLE" -name '*.msi' -o -name '*-setup.exe'); do
                # Capture first, match second — the SIGPIPE-under-pipefail
                # hazard that inverted the deb check on the previous run.
                #
                # The grep runs over `7z l` LISTING OUTPUT — names and
                # metadata — and that is what makes the pattern sound. Do NOT
                # "simplify" this to grep over the installer BYTES: the NSIS
                # payload carries 40 ASCII `jawata[-_]hook` occurrences and the
                # DMG 329, every one a string constant compiled into the
                # binaries (jawata-hook-primer, jawata-hook/src/cue.rs, ...).
                # Byte-matching would make this assertion a tautology that can
                # never fail.
                # `|| true` is LOAD-BEARING, and `head -1` is deliberately
                # absent. Moving the grep out of an `if` condition armed
                # `set -e` on it: on a genuine no-match grep exits 1, pipefail
                # propagates, and the step died at THIS line — so the FAIL
                # diagnostic below became unreachable and a real containment
                # failure printed a bare "exit code 1". And `| head -1` was a
                # new pipe carrying the very SIGPIPE-under-pipefail hazard the
                # comment above says was designed out; it bought nothing,
                # since MATCH is only tested for emptiness and printed.
                MATCH=$(printf '%s' "$(7z l "$INSTALLER" 2>/dev/null)" | grep -Ei 'jawata[-_]hook') || true
                if [ -n "$MATCH" ]; then
                  # Print the MATCHED ENTRY, not merely the path: a pass that
                  # shows only what was searched cannot be told apart from a
                  # pass that found nothing, which was the original complaint.
                  echo "carries the hook: $INSTALLER  <- $MATCH"
                  case "$INSTALLER" in *.msi) SAW_MSI=1 ;; *-setup.exe) SAW_NSIS=1 ;; esac
                else
                  echo "FAIL: $INSTALLER does not contain the hook sidecar."
                  7z l "$INSTALLER" 2>&1 | head -40
                  exit 1
                fi
                N=$((N+1))
              done
              # A floor, because an empty `find` and a genuine pass are
              # otherwise the same observable: zero iterations of a loop that
              # never fails is indistinguishable from every installer passing.
              # Per KIND, not a count: `N -ge 2` was satisfied by two .msi and
              # zero NSIS, which is not what the sentence above it claimed.
              if [ "$SAW_MSI" -ne 1 ] || [ "$SAW_NSIS" -ne 1 ]; then
                echo "FAIL: need BOTH installers verified (msi=$SAW_MSI nsis=$SAW_NSIS, inspected $N)."
                find "$BUNDLE" -maxdepth 2 -type f | head -20
                exit 1
              fi
              echo "inspected $N Windows installers (msi + nsis), all carry the hook"
              ;;
            *darwin*)
              # The .app IS the payload — a real directory tree.
              APP_HOOK=$(find "$BUNDLE/macos" -path '*/Contents/MacOS/jawata-hook' | head -1)
              [ -n "$APP_HOOK" ] || { echo "FAIL: no jawata-hook in the .app"; find "$BUNDLE" -maxdepth 3 | head -20; exit 1; }
              echo "app carries the hook: $APP_HOOK"
              # And it must be SIGNED, or Apple's notary service rejects the
              # whole bundle for a nested unsigned executable.
              codesign -dv --verbose=2 "$APP_HOOK" 2>&1 | head -5 || {
                echo "FAIL: the sidecar is not signed; notarization would reject the bundle"; exit 1; }
              ;;
            *)
              # Linux: inspect the .deb itself, not the staging directory the
              # bundler leaves beside it.
              DEB=$(find "$BUNDLE/deb" -name '*.deb' | head -1)
              [ -n "$DEB" ] || { echo "FAIL: no .deb built"; exit 1; }
              # NOT `dpkg-deb -c | grep -q`. Under `set -o pipefail`, grep -q
              # exits on the FIRST match and closes the pipe, dpkg-deb dies of
              # SIGPIPE, and pipefail turns a SUCCESSFUL match into a failed
              # pipeline. That is what failed both Linux jobs on the re-fired
              # run while the .deb was correct all along — usr/bin/jawata-hook
              # was right there in the dump the failure printed.
              LISTING=$(dpkg-deb -c "$DEB")
              case "$LISTING" in
                *jawata-hook*) echo "deb carries the hook:"; printf '%s\n' "$LISTING" | grep 'jawata-hook' ;;
                *) echo "FAIL: the .deb does not contain jawata-hook"; printf '%s\n' "$LISTING" | head -20; exit 1 ;;
              esac
              ;;
          esac

      - name: Bake WEBKIT_DISABLE_DMABUF_RENDERER into AppImage AppRun + .deb wrapper (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          set -euo pipefail

          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64)  APPIMAGETOOL_ARCH=x86_64 ;;
            aarch64) APPIMAGETOOL_ARCH=aarch64 ;;
            *)       echo "Unsupported arch: $ARCH"; exit 1 ;;
          esac

          # --- AppImage: extract → patch AppRun → repack ---
          pushd src-tauri/target/release/bundle/appimage
          APP_IMAGE=$(ls jawata-studio_*.AppImage | head -1)
          chmod +x "$APP_IMAGE"
          ./"$APP_IMAGE" --appimage-extract >/dev/null
          if ! grep -q '^exec ' squashfs-root/AppRun; then
            echo "Error: AppRun does not contain an 'exec' line at column 1; bake-in failed."
            echo "--- AppRun contents ---"
            cat squashfs-root/AppRun
            exit 1
          fi
          # Inject export line before the first exec in AppRun.
          # WebKitGTK >= 2.42 DMABUF compositor fails silently on
          # NVIDIA Grace (aarch64, GB10) and some x86_64 GPU stacks
          # — disabling it via this env-var avoids the blank webview.
          sed -i '0,/^exec /{s|^exec |export WEBKIT_DISABLE_DMABUF_RENDERER=1\nexec |}' squashfs-root/AppRun
          # Repack. --appimage-extract-and-run avoids FUSE on CI runners.
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${APPIMAGETOOL_ARCH}.AppImage" -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          # Assert on the tree about to be packed. The AppImage is the PRIMARY
          # Linux download (install.sh resolves /releases/latest) and was the
          # one shipped artifact nothing inspected — the containment check
          # reads only the .deb, and this repack is the step most able to lose
          # the sidecar, since it extracts and rebuilds the payload.
          if [ ! -x squashfs-root/usr/bin/jawata-hook ] || [ ! -x squashfs-root/usr/bin/jawata-studio ]; then
            echo "FAIL: the AppImage payload has no hook beside the executable"
            find squashfs-root/usr/bin -maxdepth 1
            exit 1
          fi
          echo "AppImage payload adjacency OK: jawata-hook beside jawata-studio"
          /tmp/appimagetool --appimage-extract-and-run squashfs-root "$APP_IMAGE"
          rm -rf squashfs-root /tmp/appimagetool
          popd

          # --- .deb: unpack → move binary + write wrapper → repack ---
          pushd src-tauri/target/release/bundle/deb
          DEB=$(ls jawata-studio_*.deb | head -1)
          rm -rf /tmp/deb-extract
          mkdir -p /tmp/deb-extract
          dpkg-deb -R "$DEB" /tmp/deb-extract
          mkdir -p /tmp/deb-extract/usr/lib/jawata-studio
          mv /tmp/deb-extract/usr/bin/jawata-studio /tmp/deb-extract/usr/lib/jawata-studio/jawata-studio
          # Sprint 28 (C7 audit, F1): THE SIDECAR MOVES WITH THE EXECUTABLE.
          # Relocating the binary and leaving the hook in /usr/bin breaks the
          # adjacency the studio resolves by: current_exe() follows the wrapper's
          # exec to /usr/lib/jawata-studio/, finds no jawata-hook beside it, and
          # the deploy skips the hook binaries with NO error — a shipped install
          # with no hooks that reports success. Reproduced from the real .deb.
          mv /tmp/deb-extract/usr/bin/jawata-hook /tmp/deb-extract/usr/lib/jawata-studio/jawata-hook
          # Wrapper at /usr/bin/jawata-studio: sets the env-var,
          # then execs the real binary. Covers BOTH shell launches
          # and GNOME/KDE app-menu launches (which exec via PATH).
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            '# Sprint 14 (v0.14.0, bugs.md #1): baked at .deb build time so' \
            '# users who install via `dpkg -i` get the blank-webview fix.' \
            'export WEBKIT_DISABLE_DMABUF_RENDERER=1' \
            'exec /usr/lib/jawata-studio/jawata-studio "$@"' \
            > /tmp/deb-extract/usr/bin/jawata-studio
          chmod +x /tmp/deb-extract/usr/bin/jawata-studio
          # ADJACENCY ASSERTED AFTER THE BAKE, not before it. The earlier
          # "bundle must contain the hook" step ran before this one and verified
          # an adjacency this step then dismantled — which is exactly how F1
          # survived a check that was looking straight at it.
          REAL_DIR=/tmp/deb-extract/usr/lib/jawata-studio
          if [ ! -x "$REAL_DIR/jawata-hook" ] || [ ! -x "$REAL_DIR/jawata-studio" ]; then
            echo "FAIL: after the bake, the hook is not beside the real executable."
            echo "The studio resolves the hook relative to current_exe(); without this"
            echo "adjacency it deploys no hooks and reports success."
            find /tmp/deb-extract/usr -maxdepth 3 -type f | head -20
            exit 1
          fi
          echo "post-bake adjacency OK: $(ls "$REAL_DIR")"
          dpkg-deb -b /tmp/deb-extract "$DEB"
          rm -rf /tmp/deb-extract
          popd

      - name: Upload artifacts to draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: 'jawata-studio ${{ github.ref_name }}'
          body: 'See the assets to download this version and install.'
          draft: true
          prerelease: false
          # DELIBERATELY false. The `files:` list above passes all five globs on
          # EVERY platform while each platform produces only a subset, and the
          # action throws once per unmatched pattern — so `true` fails all five
          # jobs on the next tag, uploads nothing, and leaves /releases/latest
          # pointing at the old version. Flipped to `true` in a61b542 as a
          # "safe tightening"; it was never executed, because this step is
          # tag-gated and every run since has been a workflow_dispatch. A
          # tightening that cannot run is not safe — it is untested.
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            jawata-studio-portable-windows-*.zip

      # Sprint 16: workflow_dispatch validation runs surface the bundles as
      # workflow artifacts instead of touching any release.
      - name: Upload bundles as workflow artifacts (dispatch runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            jawata-studio-portable-windows-*.zip
          if-no-files-found: warn

  # Sprint 26 (v3.2.1, finding #6): the matrix above uploads every
  # platform's bundle to a DRAFT release (draft: true) so the release is
  # never live while assets are still missing an arch — that draft guard is
  # deliberate and stays. This job runs ONCE, after every matrix job has
  # finished uploading (`needs: release`), and flips the draft to a
  # published release, sets it as `latest`, and pins the release notes.
  #
  # It exists because the previous flow left the make-latest step to a
  # manual API call that forgot it: the studio `/releases/latest` pointer
  # stayed on v3.1.0 after v3.2.0 shipped, so install.sh (which resolves
  # /releases/latest) handed every installer the OLD app. The final verify
  # step fails the release loudly if the pointer does not advance.
  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve release notes body
        id: notes
        run: |
          set -euo pipefail
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          {
            echo 'body<<__JAWATA_NOTES__'
            if [ -f "$NOTES" ]; then
              cat "$NOTES"
            else
              echo "jawata-studio ${GITHUB_REF_NAME}. See the assets to download and install."
            fi
            echo '__JAWATA_NOTES__'
          } >> "$GITHUB_OUTPUT"

      - name: Publish release as latest
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: 'jawata-studio ${{ github.ref_name }}'
          body: ${{ steps.notes.outputs.body }}
          draft: false
          make_latest: true
          prerelease: false

      # studio#15: the step above hands the notes to the release action, which
      # then REUSES the release the matrix jobs already created ("Using release
      # N instead of duplicate draft M") and keeps that release's body. The
      # notes were dropped silently, with the step green, for every release from
      # v3.9.0 to v3.10.0 — so the body is now set EXPLICITLY, after the release
      # exists, and then read back.
      - name: Attach the release notes to the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$NOTES" ] || { echo "no notes file for ${GITHUB_REF_NAME}; leaving the body as published"; exit 0; }
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" -q .id)
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" -F body=@"$NOTES" >/dev/null
          # READ IT BACK. The defect this replaces was a step that reported
          # success while achieving nothing, so success here means the published
          # body matches the file — not that a request was accepted.
          published=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${id}" -q .body)
          if [ "$published" != "$(cat "$NOTES")" ]; then
            echo "::error::the published body does not match ${NOTES} — the notes did not land"
            exit 1
          fi
          echo "notes attached: $(wc -c < "$NOTES") bytes, verified against the published body"

      - name: Verify the latest pointer advanced
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" -q .tag_name)
          echo "releases/latest -> ${latest} (expected ${GITHUB_REF_NAME})"
          if [ "${latest}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::releases/latest still points at ${latest}, not ${GITHUB_REF_NAME} — install.sh would serve the wrong version"
            exit 1
          fi
