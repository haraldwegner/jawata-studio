name: Release
on:
  push:
    tags:
      - 'v*'
  # Sprint 16: build-only validation runs (no release created) — used to
  # iterate on the Windows matrix without burning real release tags.
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Sprint 16: windows-2022 = x64 (MSVC), windows-11-arm = ARM64.
        # Both produce .msi (WiX) + setup .exe (NSIS) via targets: "all".
        platform: [ubuntu-22.04, ubuntu-22.04-arm, macos-14, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Sprint 28 Stage 7 (D-SHIM c): the hook binary as a Tauri SIDECAR.
      # tauri.conf.json declares externalBin: ["binaries/jawata-hook"], and
      # Tauri copies binaries/jawata-hook-<target-triple> into the bundle. The
      # build MUST run before tauri-action, which fails loudly if the
      # triple-suffixed file is absent — the good failure. Building it here
      # rather than reusing target/ means a stale binary cannot ship silently.
      # No triple argument: every runner in this matrix builds NATIVELY (there
      # is no --target anywhere in this job), so the host triple IS the target
      # triple. Passing a hand-maintained platform->triple map would add a
      # five-row table that must stay in sync with the matrix for no gain.
      - name: Build the hook sidecar
        shell: bash
        run: ./build/build-hook-sidecar.sh

      - name: Install frontend dependencies
        run: npm install

      # Sprint 14 (v0.14.0, bugs.md #1 full fix): tauri-action builds
      # the bundles but does NOT upload them yet (tagName omitted on
      # purpose). The Linux-only step below post-processes the AppImage
      # and .deb to bake WEBKIT_DISABLE_DMABUF_RENDERER=1 in, then the
      # final softprops step uploads the patched artifacts to the draft
      # release. macOS artifacts (Stage 6) pass through unmodified.
      - name: Build Tauri app (build only — upload happens below)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sprint 28: Developer ID signing + notarization (studio#2). Without
          # these the .dmg is unsigned and macOS refuses to open it normally —
          # the installer has to be right-clicked and confirmed past a warning.
          #
          # Each is empty on non-macOS runners on purpose: the Linux and Windows
          # jobs share this step, and an APPLE_CERTIFICATE present there would
          # send tauri-action down its keychain-import path on a machine with no
          # keychain.
          #
          # The first two import the certificate into a temporary keychain; the
          # third selects which identity to sign with. The last three are the
          # notarization credentials — Apple checks the signed app and issues a
          # ticket, which is what actually removes the warning. APPLE_PASSWORD is
          # an app-specific password, not the account password; Apple rejects the
          # latter.
          APPLE_CERTIFICATE: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_TEAM_ID || '' }}

      # Sprint 28 (v3.6.4, D-RECALL-DEAD round): tauri-action notarizes the .app,
      # then builds the .dmg FROM it, signs the .dmg, and stops — it never
      # notarizes or staples the installer. `spctl -a -t install` inspects the
      # INSTALLER, so v3.6.3 shipped with the app notarized (Accepted, id
      # 6d38d9da) and the DMG reporting `rejected / source=Unnotarized Developer
      # ID` on a real machine. This step closes that gap with the same three
      # secrets tauri-action already uses — no new credential.
      #
      # `stapler staple` IS the gate: it fails if Apple has no valid ticket for
      # the file, so a failed or Invalid notarization cannot pass silently. The
      # spctl line is informational — a CI runner's assessment is not the user's
      # machine, so it is echoed, never trusted as the proof.
      - name: Notarize + staple the DMG (macos only)
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          echo "Notarizing installer: $DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "--- spctl (informational; the runner is not the user's machine) ---"
          spctl -a -vvv -t install "$DMG" || true

      # Sprint 28 (D-UNWIRED), the Rust half of the same gate jawata-mcp runs
      # on its release. Linux only — the answer is a property of the source,
      # identical on every target.
      #
      # AFTER the Tauri build, not before it: jawata-studio's build script needs
      # the built frontend, so running this earlier failed the compile — and the
      # gate then reported "arm-did-not-run" rather than the compile error,
      # because CI colourises cargo's output and the error match did not allow
      # for ANSI escapes. Both found by firing a real CI run (C7).
      - name: Hollow-wiring gate (test-only items)
        if: matrix.platform == 'ubuntu-22.04'
        run: ./build/unwired-gate.sh

      # C7 exit: "a built bundle on each of the five targets CONTAINS the hook
      # binary". Checked on the artefact, per platform, because externalBin
      # failing to copy is silent from the app's point of view — the studio
      # would deploy nothing and the hooks would simply never exist.
      - name: The bundle must contain the hook sidecar
        shell: bash
        run: |
          set -euo pipefail
          TRIPLE=$(rustc -vV | awk '/^host:/ {print $2}')
          EXT=""; case "$TRIPLE" in *windows*) EXT=".exe" ;; esac
          BUNDLE=src-tauri/target/release/bundle

          # PER-PLATFORM, because the payload is a different KIND of thing on
          # each. The first version ran one `find` over $BUNDLE and passed on
          # Linux and macOS while FAILING both Windows jobs — the Windows
          # bundle holds only .msi and NSIS .exe archives, and `find` cannot
          # see inside an archive. That check would have blocked a real release
          # instead of catching a defect. Found by firing a build-only run.
          case "$TRIPLE" in
            *windows*)
              # The installers are archives. 7z ships on GitHub's Windows
              # runners; list them and look for the sidecar by name.
              FOUND=""
              for INSTALLER in $(find "$BUNDLE" -name '*.msi' -o -name '*-setup.exe'); do
                if 7z l "$INSTALLER" 2>/dev/null | grep -qi "jawata-hook"; then
                  FOUND="$FOUND $INSTALLER"
                fi
              done
              if [ -z "$FOUND" ]; then
                echo "FAIL: no installer under $BUNDLE contains jawata-hook$EXT."
                find "$BUNDLE" -maxdepth 2 -type f | head -20
                exit 1
              fi
              echo "installers carrying the hook:$FOUND"
              ;;
            *darwin*)
              # The .app IS the payload — a real directory tree.
              APP_HOOK=$(find "$BUNDLE/macos" -path '*/Contents/MacOS/jawata-hook' | head -1)
              [ -n "$APP_HOOK" ] || { echo "FAIL: no jawata-hook in the .app"; find "$BUNDLE" -maxdepth 3 | head -20; exit 1; }
              echo "app carries the hook: $APP_HOOK"
              # And it must be SIGNED, or Apple's notary service rejects the
              # whole bundle for a nested unsigned executable.
              codesign -dv --verbose=2 "$APP_HOOK" 2>&1 | head -5 || {
                echo "FAIL: the sidecar is not signed; notarization would reject the bundle"; exit 1; }
              ;;
            *)
              # Linux: inspect the .deb itself, not the staging directory the
              # bundler leaves beside it.
              DEB=$(find "$BUNDLE/deb" -name '*.deb' | head -1)
              [ -n "$DEB" ] || { echo "FAIL: no .deb built"; exit 1; }
              dpkg-deb -c "$DEB" | grep -q 'jawata-hook' || {
                echo "FAIL: the .deb does not contain jawata-hook"; dpkg-deb -c "$DEB" | head -20; exit 1; }
              echo "deb carries the hook:"; dpkg-deb -c "$DEB" | grep 'jawata-hook'
              ;;
          esac

      - name: Bake WEBKIT_DISABLE_DMABUF_RENDERER into AppImage AppRun + .deb wrapper (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          set -euo pipefail

          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64)  APPIMAGETOOL_ARCH=x86_64 ;;
            aarch64) APPIMAGETOOL_ARCH=aarch64 ;;
            *)       echo "Unsupported arch: $ARCH"; exit 1 ;;
          esac

          # --- AppImage: extract → patch AppRun → repack ---
          pushd src-tauri/target/release/bundle/appimage
          APP_IMAGE=$(ls jawata-studio_*.AppImage | head -1)
          chmod +x "$APP_IMAGE"
          ./"$APP_IMAGE" --appimage-extract >/dev/null
          if ! grep -q '^exec ' squashfs-root/AppRun; then
            echo "Error: AppRun does not contain an 'exec' line at column 1; bake-in failed."
            echo "--- AppRun contents ---"
            cat squashfs-root/AppRun
            exit 1
          fi
          # Inject export line before the first exec in AppRun.
          # WebKitGTK >= 2.42 DMABUF compositor fails silently on
          # NVIDIA Grace (aarch64, GB10) and some x86_64 GPU stacks
          # — disabling it via this env-var avoids the blank webview.
          sed -i '0,/^exec /{s|^exec |export WEBKIT_DISABLE_DMABUF_RENDERER=1\nexec |}' squashfs-root/AppRun
          # Repack. --appimage-extract-and-run avoids FUSE on CI runners.
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${APPIMAGETOOL_ARCH}.AppImage" -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          /tmp/appimagetool --appimage-extract-and-run squashfs-root "$APP_IMAGE"
          rm -rf squashfs-root /tmp/appimagetool
          popd

          # --- .deb: unpack → move binary + write wrapper → repack ---
          pushd src-tauri/target/release/bundle/deb
          DEB=$(ls jawata-studio_*.deb | head -1)
          rm -rf /tmp/deb-extract
          mkdir -p /tmp/deb-extract
          dpkg-deb -R "$DEB" /tmp/deb-extract
          mkdir -p /tmp/deb-extract/usr/lib/jawata-studio
          mv /tmp/deb-extract/usr/bin/jawata-studio /tmp/deb-extract/usr/lib/jawata-studio/jawata-studio
          # Sprint 28 (C7 audit, F1): THE SIDECAR MOVES WITH THE EXECUTABLE.
          # Relocating the binary and leaving the hook in /usr/bin breaks the
          # adjacency the studio resolves by: current_exe() follows the wrapper's
          # exec to /usr/lib/jawata-studio/, finds no jawata-hook beside it, and
          # the deploy skips the hook binaries with NO error — a shipped install
          # with no hooks that reports success. Reproduced from the real .deb.
          mv /tmp/deb-extract/usr/bin/jawata-hook /tmp/deb-extract/usr/lib/jawata-studio/jawata-hook
          # Wrapper at /usr/bin/jawata-studio: sets the env-var,
          # then execs the real binary. Covers BOTH shell launches
          # and GNOME/KDE app-menu launches (which exec via PATH).
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            '# Sprint 14 (v0.14.0, bugs.md #1): baked at .deb build time so' \
            '# users who install via `dpkg -i` get the blank-webview fix.' \
            'export WEBKIT_DISABLE_DMABUF_RENDERER=1' \
            'exec /usr/lib/jawata-studio/jawata-studio "$@"' \
            > /tmp/deb-extract/usr/bin/jawata-studio
          chmod +x /tmp/deb-extract/usr/bin/jawata-studio
          # ADJACENCY ASSERTED AFTER THE BAKE, not before it. The earlier
          # "bundle must contain the hook" step ran before this one and verified
          # an adjacency this step then dismantled — which is exactly how F1
          # survived a check that was looking straight at it.
          REAL_DIR=/tmp/deb-extract/usr/lib/jawata-studio
          if [ ! -x "$REAL_DIR/jawata-hook" ] || [ ! -x "$REAL_DIR/jawata-studio" ]; then
            echo "FAIL: after the bake, the hook is not beside the real executable."
            echo "The studio resolves the hook relative to current_exe(); without this"
            echo "adjacency it deploys no hooks and reports success."
            find /tmp/deb-extract/usr -maxdepth 3 -type f | head -20
            exit 1
          fi
          echo "post-bake adjacency OK: $(ls "$REAL_DIR")"
          dpkg-deb -b /tmp/deb-extract "$DEB"
          rm -rf /tmp/deb-extract
          popd

      - name: Upload artifacts to draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'jawata-studio ${{ github.ref_name }}'
          body: 'See the assets to download this version and install.'
          draft: true
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      # Sprint 16: workflow_dispatch validation runs surface the bundles as
      # workflow artifacts instead of touching any release.
      - name: Upload bundles as workflow artifacts (dispatch runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  # Sprint 26 (v3.2.1, finding #6): the matrix above uploads every
  # platform's bundle to a DRAFT release (draft: true) so the release is
  # never live while assets are still missing an arch — that draft guard is
  # deliberate and stays. This job runs ONCE, after every matrix job has
  # finished uploading (`needs: release`), and flips the draft to a
  # published release, sets it as `latest`, and pins the release notes.
  #
  # It exists because the previous flow left the make-latest step to a
  # manual API call that forgot it: the studio `/releases/latest` pointer
  # stayed on v3.1.0 after v3.2.0 shipped, so install.sh (which resolves
  # /releases/latest) handed every installer the OLD app. The final verify
  # step fails the release loudly if the pointer does not advance.
  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release notes body
        id: notes
        run: |
          set -euo pipefail
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          {
            echo 'body<<__JAWATA_NOTES__'
            if [ -f "$NOTES" ]; then
              cat "$NOTES"
            else
              echo "jawata-studio ${GITHUB_REF_NAME}. See the assets to download and install."
            fi
            echo '__JAWATA_NOTES__'
          } >> "$GITHUB_OUTPUT"

      - name: Publish release as latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'jawata-studio ${{ github.ref_name }}'
          body: ${{ steps.notes.outputs.body }}
          draft: false
          make_latest: true
          prerelease: false

      - name: Verify the latest pointer advanced
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" -q .tag_name)
          echo "releases/latest -> ${latest} (expected ${GITHUB_REF_NAME})"
          if [ "${latest}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::releases/latest still points at ${latest}, not ${GITHUB_REF_NAME} — install.sh would serve the wrong version"
            exit 1
          fi
